<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พระบรมธาตุไชยา AI Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-icon"><i class="fa-solid fa-gopuram"></i></div>
            <div class="header-text">
                <h2>มัคคุเทศก์ AI</h2>
                <p>ผู้เชี่ยวชาญพระบรมธาตุไชยา</p>
            </div>
        </div>

        <div id="chat-box" class="chat-box">
            <div class="message bot-message">
                <div class="msg-content">
                    สวัสดีครับ 🙏 ผมคือ AI ผู้นำเที่ยวพระบรมธาตุไชยา<br>
                    สอบถามประวัติ ความเป็นมา หรือเส้นทางเดินรถได้เลยครับ!
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="พิมพ์คำถามที่นี่..." autocomplete="off">
            <button onclick="askAI()" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
